services:
  mongodb:
    image: mongo:4.4
    container_name: nodegoat-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nodegoat-network
    healthcheck:
      test: echo 'db.stats().ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  nodegoat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodegoat-app
    restart: always
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      PORT: ${APP_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nodegoat-network
    command: >
      sh -c "npm run db:seed && npm start"

volumes:
  mongo-data:

networks:
  nodegoat-network:
    driver: bridge